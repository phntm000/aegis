# Aegis simulator screenshots
#
# Manual-only workflow: builds the app for the iOS Simulator, boots a
# simulator, installs and launches the genuinely running app, and captures
# real screenshots (not mockups). Artifacts are uploaded as `aegis-screenshots`.

name: Simulator screenshots

on:
  workflow_dispatch:

env:
  XCODE_APP: /Applications/Xcode_16.2.app
  SIM_DEVICE: iPhone 16
  BUNDLE_ID: app.aegis.ios

jobs:
  screenshots:
    name: Capture simulator screenshots
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for simulator (unsigned)
        run: >
          xcodebuild build
          -project Aegis.xcodeproj
          -scheme Aegis
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      - name: Strip broadcast extension (simulator cannot install it)
        run: |
          # ReplayKit broadcast upload extensions cannot be installed on the
          # iOS simulator (platform limitation). The extension target still
          # compiles and ships on device builds; strip it from the simulator
          # .app so simctl install succeeds.
          rm -rf build/Build/Products/Debug-iphonesimulator/Aegis.app/PlugIns/AegisBroadcastUpload.appex

      - name: Boot simulator (newest iOS runtime)
        run: |
          set -euo pipefail
          # 1. Resolve the newest available iOS runtime on this runner.
          RUNTIME_JSON=$(xcrun simctl list runtimes -j)
          NEWEST=$(echo "$RUNTIME_JSON" | python3 -c "
          import json, sys
          rs = json.load(sys.stdin)['runtimes']
          ios = [r for r in rs if r.get('platform') == 'iOS' and r.get('isAvailable')]
          ios.sort(key=lambda r: [int(x) for x in r['version'].split('.')])
          r = ios[-1]
          print(r['identifier'], r['version'])
          ")
          RUNTIME_ID=$(echo "$NEWEST" | cut -d' ' -f1)
          IOS_VER=$(echo "$NEWEST" | cut -d' ' -f2)
          echo "Selected iOS runtime: $IOS_VER ($RUNTIME_ID)"
          # 2. Find an existing device on that runtime; create one if needed.
          UDID=$(xcrun simctl list devices -j | python3 -c "
          import json, sys
          target = sys.argv[1]
          devs = json.load(sys.stdin)['devices']
          for rt, lst in devs.items():
              if rt == target:
                  for d in lst:
                      if d.get('name') in ('AegisShot', 'iPhone 16') and d.get('isAvailable'):
                          print(d['udid']); sys.exit(0)
          " "$RUNTIME_ID" || true)
          if [ -z "${UDID:-}" ]; then
            UDID=$(xcrun simctl create "AegisShot" "iPhone 16" "$RUNTIME_ID")
            echo "Created device AegisShot: $UDID"
          else
            echo "Reusing device: $UDID"
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          # 3. Boot by UDID and wait until it is ready.
          echo "Booting $UDID (iOS $IOS_VER)..."
          xcrun simctl boot "$UDID" 2>/dev/null || echo "simulator already booted or boot in progress"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"

      - name: Install and launch app
        run: |
          set -u
          APP_PATH=$(ls -d build/Build/Products/Debug-iphonesimulator/Aegis.app)
          echo "Installing $APP_PATH on $SIM_UDID"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          echo "Launching $BUNDLE_ID"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"

      - name: Capture screenshots
        run: |
          set -u
          echo "Waiting for app to settle..."
          sleep 12
          xcrun simctl io "$SIM_UDID" screenshot shot-01-launch.png
          echo "Captured shot-01-launch.png"
          # Exercise the in-app retry path: relaunch and screenshot again.
          # (Keychain/database failures can be transient right after boot.)
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 3
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 12
          xcrun simctl io "$SIM_UDID" screenshot shot-02-retry.png
          echo "Captured shot-02-retry.png"
          ls -la shot-*.png
          file shot-*.png

      - name: Dump app log tail (diagnostic)
        if: always()
        run: |
          xcrun simctl spawn "$SIM_UDID" log show --style compact --predicate 'process == "Aegis"' --last 5m 2>/dev/null | tail -40 || echo "log unavailable"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: aegis-screenshots
          path: shot-*.png
          if-no-files-found: error
