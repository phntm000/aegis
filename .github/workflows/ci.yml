# Aegis CI
#
# Runs on GitHub's macOS runners because Swift/iOS builds require Apple's
# toolchain (Swift cannot compile on Linux). Three jobs:
#   1. swift-packages — `swift test` for each SPM library package
#   2. app           — XcodeGen generates the project, xcodebuild builds + tests
#   3. relay         — the Python relay's self-test (runs on ubuntu; no Xcode needed)
#
# No paid Apple Developer account is required: builds use CODE_SIGNING_ALLOWED=NO
# and tests run on the iOS Simulator.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_16.2.app

jobs:
  swift-packages:
    name: Swift packages (build + test)
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Show Swift version
        run: swift --version

      - name: Test AegisStore
        run: swift test --package-path Packages/AegisStore

      - name: Test AegisCrypto
        env:
          SWIFT_BACKTRACE: enable=yes
        run: swift test --package-path Packages/AegisCrypto

      - name: Dump crash report (diagnostic)
        if: failure()
        run: |
          d=~/Library/Logs/DiagnosticReports
          f=$(ls -t "$d"/AegisCryptoPackageTests*.ips 2>/dev/null | head -1)
          if [ -z "$f" ]; then f=$(ls -t "$d"/*.ips 2>/dev/null | head -1); fi
          if [ -n "$f" ]; then echo "=== $f ==="; python3 -c "
          import json,sys
          d=json.load(open('$f'))
          print(d.get('exception',{}))
          print(d.get('faultingThread',{}).get('frames','')[:0])
          for fr in d.get('threads',[])[:1]:
              pass
          # print crashed thread frames
          for t in d.get('threads',[]):
              if t.get('triggered'):
                  for fr in t['frames'][:25]:
                      print(fr.get('image','?')[-40:], hex(fr.get('imageOffset',0)), fr.get('symbol','?')[:80])
                  break
          "; else echo "no ips crash report found"; fi

      - name: Test AegisTransport
        run: swift test --package-path Packages/AegisTransport

      - name: Build WebRTCBridge (verifies pinned binary URL + checksum)
        run: swift build --package-path Packages/WebRTCBridge

  app:
    name: iOS app (XcodeGen + xcodebuild)
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ReplayKit broadcast upload extensions cannot be installed on the iOS
      # simulator (platform limitation) — the extension target still compiles
      # here and ships on device builds, but the .appex must be stripped from
      # the simulator .app between build and install or simctl install fails.
      # Stripping happens AFTER the build (not as a build phase) because
      # Xcode's ValidateEmbeddedBinary phase runs after all script phases and
      # fails on a deleted appex.
      - name: Build & test app (simulator, unsigned)
        run: |
          xcodebuild build-for-testing \
            -project Aegis.xcodeproj \
            -scheme Aegis \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath /tmp/AegisDerivedData \
            CODE_SIGNING_ALLOWED=NO
          rm -rf /tmp/AegisDerivedData/Build/Products/Debug-iphonesimulator/Aegis.app/PlugIns/AegisBroadcastUpload.appex
          XCTESTRUN=$(find /tmp/AegisDerivedData/Build/Products -maxdepth 1 -name '*.xctestrun' | head -1)
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'

  relay:
    name: Relay self-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relay self-test
        run: python3 relay/relay.py --self-test
