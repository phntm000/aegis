# yaml-language-server: $schema=https://raw.githubusercontent.com/yonaskolb/XcodeGen/master/Distributions/XcodeGen.schema.json
#
# Aegis — XcodeGen project definition.
# Generate with:  xcodegen generate
#
# The app target compiles against the three local SwiftPM packages owned by
# the other workstreams (AegisCrypto, AegisTransport, AegisStore). Until those
# land, the app builds and previews against the mock services in
# Aegis/Support/PreviewServices.swift — see Aegis/INTEGRATION_NOTES.md.

name: Aegis

options:
  bundleIdPrefix: app.aegis
  deploymentTarget:
    iOS: "17.0"
  indentWidth: 2
  usesTabs: false
  createIntermediateGroups: true

# Local packages (Agent 4 owns their Package.swift manifests).
# If a package's library product is named differently, update `products` below.
packages:
  AegisCrypto:
    path: Packages/AegisCrypto
  AegisTransport:
    path: Packages/AegisTransport
  AegisStore:
    path: Packages/AegisStore
  WebRTCBridge:
    path: Packages/WebRTCBridge
  # Added by the multidevice-v2 stream (merged from main): linked-device
  # blob transfer package. Kept here so this branch doesn't revert it.
  AegisDeviceLink:
    path: Packages/AegisDeviceLink
  AegisModeration:
    path: Packages/AegisModeration

targets:
  Aegis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Aegis
        excludes:
          - "INTEGRATION_NOTES.md"
          - "Info.plist"
          - "*.entitlements"
          - "**/*.md"
    entitlements:
      path: Aegis/Aegis.entitlements
    dependencies:
      - target: AegisBroadcastUpload
      - package: AegisCrypto
        products:
          - AegisCrypto
      - package: AegisTransport
        products:
          - AegisTransport
      - package: AegisStore
        products:
          - AegisStore
      # Merged from main (multidevice-v2 stream); do not drop.
      - package: AegisDeviceLink
        products:
          - AegisDeviceLink
      - package: WebRTCBridge
        products:
          - WebRTCBridge
      - package: AegisModeration
        products:
          - AegisModeration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aegis.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # <-- set your Apple team id for device builds
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
        ENABLE_APP_TRANSPORT_SECURITY: YES
    info:
      path: Aegis/Info.plist

  # Broadcast Upload Extension for full-device screen sharing in calls.
  # The extension captures the whole screen (in-app code can't) and hands
  # JPEG frames to the app through the shared App Group container; the app
  # feeds them into the call's existing video track (see
  # Aegis/Media/BroadcastShare.swift). XcodeGen embeds the .appex in the
  # app's PlugIns directory via the target dependency above.
  AegisBroadcastUpload:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AegisBroadcastUpload
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "**/*.md"
    info:
      path: AegisBroadcastUpload/Info.plist
    entitlements:
      path: AegisBroadcastUpload/AegisBroadcastUpload.entitlements
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aegis.ios.BroadcastUpload
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # <-- set your Apple team id for device builds
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE

  # Unit tests for app-layer logic (crypto engine, adapters). Runs on the
  # iOS simulator in CI via `xcodebuild test`.
  AegisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AegisTests
    dependencies:
      - target: Aegis
      - package: AegisCrypto
        products:
          - AegisCrypto
      - package: WebRTCBridge
        products:
          - WebRTCBridge
      - package: AegisModeration
        products:
          - AegisModeration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aegis.ios.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  Aegis:
    build:
      targets:
        Aegis: all
    test:
      targets:
        - AegisTests
    run:
      config: Debug
