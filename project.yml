# yaml-language-server: $schema=https://raw.githubusercontent.com/yonaskolb/XcodeGen/master/Distributions/XcodeGen.schema.json
#
# Aegis — XcodeGen project definition.
# Generate with:  xcodegen generate
#
# The app target compiles against the three local SwiftPM packages owned by
# the other workstreams (AegisCrypto, AegisTransport, AegisStore). Until those
# land, the app builds and previews against the mock services in
# Aegis/Support/PreviewServices.swift — see Aegis/INTEGRATION_NOTES.md.

name: Aegis

options:
  bundleIdPrefix: app.aegis
  deploymentTarget:
    iOS: "17.0"
  indentWidth: 2
  usesTabs: false
  createIntermediateGroups: true

# Local packages (Agent 4 owns their Package.swift manifests).
# If a package's library product is named differently, update `products` below.
packages:
  AegisCrypto:
    path: Packages/AegisCrypto
  AegisTransport:
    path: Packages/AegisTransport
  AegisStore:
    path: Packages/AegisStore

targets:
  Aegis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Aegis
        excludes:
          - "INTEGRATION_NOTES.md"
          - "Info.plist"
          - "**/*.md"
    dependencies:
      - package: AegisCrypto
        products:
          - AegisCrypto
      - package: AegisTransport
        products:
          - AegisTransport
      - package: AegisStore
        products:
          - AegisStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aegis.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # <-- set your Apple team id for device builds
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
        ENABLE_APP_TRANSPORT_SECURITY: YES
    info:
      path: Aegis/Info.plist
